<!doctype html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadro de Vagas Moçambique | Vagas de emprego abertas</title>
  <meta name="description" content="Vagas de emprego abertas em Moçambique. Candidate-se directamente pelo link ou contacto da empresa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="./">Quadro de Vagas</a>
      <a class="header-link" href="admin.html">Área do administrador</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Vagas abertas em Moçambique</h1>
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cargo, empresa ou cidade (ex.: Maputo)" aria-label="Buscar vagas" autocomplete="off">
      </div>

      <div class="filters">
        <select id="f-modality" aria-label="Filtrar por modalidade">
          <option value="">Todas as modalidades</option>
        </select>
        <select id="f-type" aria-label="Filtrar por tipo de contrato">
          <option value="">Todos os contratos</option>
        </select>
        <select id="f-category" aria-label="Filtrar por área">
          <option value="">Todas as áreas</option>
        </select>
        <button id="clear" class="link-btn" type="button" hidden>Limpar filtros</button>
      </div>
      <p id="count" class="count" aria-live="polite"></p>
    </section>

    <section aria-label="Lista de vagas">
      <div id="state" class="state" hidden></div>
      <div id="ad-top" class="ad-slot" hidden></div>
      <ul id="jobs" class="jobs" hidden></ul>
      <div class="more"><button id="more" class="btn secondary" type="button" hidden>Mostrar mais vagas</button></div>
      <div id="ad-bottom" class="ad-slot" hidden></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">Ao se candidatar, você será levado ao site ou e-mail da empresa que publicou a vaga. <a href="privacidade.html">Política de privacidade</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
